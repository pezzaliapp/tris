<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulizia cache — Il Cubo di PezzaliApp</title>
<style>
  :root{ --bg:#070a10; --text:#e9eef7; --muted:#9fb0c8; --line:rgba(255,255,255,.12);
    --accent:#4aa3ff; --accent2:#44d19e; --ok:#44d19e; }
  *{box-sizing:border-box}
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 20% 10%, rgba(74,163,255,.18), transparent 55%),
      radial-gradient(800px 600px at 80% 25%, rgba(68,209,158,.14), transparent 55%),
      var(--bg); }
  .card{ width:min(560px,100%); border:1px solid var(--line); border-radius:18px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    box-shadow: 0 18px 55px rgba(0,0,0,.45); padding:24px; backdrop-filter: blur(10px); }
  h1{ margin:0 0 6px; font-size:20px; font-weight:950; letter-spacing:.3px }
  h1 .gr{ background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent }
  p{ color:var(--muted); font-size:14px; line-height:1.5; margin:8px 0 0 }
  pre{ white-space:pre-wrap; background:rgba(0,0,0,.28); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-size:12px; margin:16px 0 0; min-height:64px; color:#cfe0f5 }
  .ok{ color:var(--ok); font-weight:800 }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px }
  button,a.btn{ border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text);
    padding:11px 16px; border-radius:14px; cursor:pointer; font-weight:900; font-size:14px;
    text-decoration:none; display:inline-block }
  button.primary{ border-color:rgba(74,163,255,.35); background:rgba(74,163,255,.14) }
  a.btn.good{ border-color:rgba(68,209,158,.35); background:rgba(68,209,158,.12) }
</style>
</head>
<body>
  <div class="card">
    <h1>Pulizia cache — Il <span class="gr">Cubo di PezzaliApp</span></h1>
    <p>Questa pagina annulla la registrazione dei service worker e svuota le cache di questo sito,
       così la prossima apertura carica sempre la versione più recente. Pulizia automatica all'avvio.</p>
    <pre id="log">Avvio pulizia…</pre>
    <div class="row">
      <button class="primary" id="again">Pulisci di nuovo</button>
      <a class="btn good" href="./index.html">Apri il Cubo →</a>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const log = document.getElementById('log');
  const line = (msg, ok) => {
    const d = document.createElement('div');
    if (ok) d.className = 'ok';
    d.textContent = msg;
    log.appendChild(d);
  };

  async function clearAll(){
    log.textContent = '';
    let swCount = 0, cacheCount = 0;

    // 1) Service workers
    if ('serviceWorker' in navigator) {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) { await r.unregister(); swCount++; }
        line('Service worker rimossi: ' + swCount);
      } catch (e) { line('Service worker: ' + (e.message || e)); }
    } else {
      line('Service worker non supportati da questo browser.');
    }

    // 2) Cache Storage
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        for (const k of keys) { await caches.delete(k); cacheCount++; }
        line('Cache svuotate: ' + cacheCount);
      } catch (e) { line('Cache: ' + (e.message || e)); }
    } else {
      line('Cache Storage non supportato da questo browser.');
    }

    // 3) localStorage / sessionStorage (solo di questo sito)
    try {
      localStorage.clear();
      sessionStorage.clear();
      line('localStorage e sessionStorage svuotati.');
    } catch (e) { line('Storage: ' + (e.message || e)); }

    line('Pulizia completata. Ricarica forzata o apri il Cubo.', true);
  }

  document.getElementById('again').addEventListener('click', clearAll);
  clearAll();
})();
</script>
</body>
</html>
